
<!DOCTYPE html>
<html lang="ckb" dir="rtl" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>زیکرەکانی بەیانیان و ئێواران</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Vazirmatn:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #0d9488;
            --primary-hover: #0f766e;
            --primary-light: #ccfbf1;
            --bg-body: #f8fafc;
            --bg-card: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --card-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
            --font-arabic: 'Amiri', serif;
            --font-kurdish: 'Vazirmatn', sans-serif;
            --base-font-size: 1.25rem;
        }
        [data-theme="dark"] {
            --primary: #14b8a6;
            --primary-hover: #2dd4bf;
            --primary-light: #134e4a;
            --bg-body: #0f172a;
            --bg-card: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
            --card-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: var(--font-kurdish); background-color: var(--bg-body); color: var(--text-main); min-height: 100vh; padding-bottom: 80px; }
        header { background: var(--bg-card); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 100; }
        .nav-container { max-width: 900px; margin: 0 auto; padding: 1rem; display: flex; justify-content: space-between; align-items: center; }
        .logo { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 1.3rem; color: var(--primary); }
        .controls { display: flex; align-items: center; gap: 10px; }
        .btn-icon { background: transparent; border: 1px solid var(--border); color: var(--text-main); width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 1.1rem; }
        .btn-icon:hover { background: var(--primary-light); color: var(--primary); }
        .container { max-width: 900px; margin: 0 auto; padding: 1.5rem 1rem; }
        .tabs-container { display: flex; gap: 12px; margin-bottom: 1.5rem; background: var(--bg-card); padding: 8px; border-radius: 16px; border: 1px solid var(--border); box-shadow: var(--card-shadow); }
        .tab-btn { flex: 1; padding: 14px; border: none; border-radius: 12px; font-family: var(--font-kurdish); font-size: 1.1rem; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; background: transparent; color: var(--text-muted); transition: all 0.3s ease; }
        .tab-btn.active { background: var(--primary); color: white; box-shadow: 0 4px 14px rgba(13, 148, 136, 0.3); }
        .progress-card { background: var(--bg-card); border-radius: 16px; padding: 1.25rem; border: 1px solid var(--border); box-shadow: var(--card-shadow); margin-bottom: 1.5rem; }
        .progress-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; font-weight: 700; }
        .progress-bar-bg { height: 10px; background: var(--border); border-radius: 20px; overflow: hidden; }
        .progress-bar-fill { height: 100%; background: linear-gradient(90deg, var(--primary), #3b82f6); width: 0%; transition: width 0.4s ease; border-radius: 20px; }
        .search-box { position: relative; margin-bottom: 1.5rem; }
        .search-box input { width: 100%; padding: 14px 45px 14px 15px; border-radius: 14px; border: 1px solid var(--border); background: var(--bg-card); color: var(--text-main); font-family: var(--font-kurdish); font-size: 1rem; outline: none; }
        .search-box i { position: absolute; right: 16px; top: 50%; transform: translateY(-50%); color: var(--text-muted); }
        .zikr-list { display: flex; flex-direction: column; gap: 1.25rem; }
        .zikr-card { background: var(--bg-card); border-radius: 18px; padding: 1.5rem; border: 1px solid var(--border); box-shadow: var(--card-shadow); }
        .zikr-card.completed { opacity: 0.6; border-color: var(--primary); }
        .zikr-text { font-family: var(--font-arabic); font-size: var(--base-font-size); line-height: 2.2; color: var(--text-main); margin-bottom: 1.5rem; text-align: justify; direction: rtl; white-space: pre-line; }
        .zikr-footer { display: flex; align-items: center; justify-content: space-between; border-top: 1px solid var(--border); padding-top: 1rem; gap: 10px; flex-wrap: wrap; }
        .counter-btn { background: var(--primary); color: white; border: none; padding: 8px 20px; border-radius: 30px; font-family: var(--font-kurdish); font-weight: 700; font-size: 1rem; cursor: pointer; display: flex; align-items: center; gap: 8px; box-shadow: 0 4px 10px rgba(13, 148, 136, 0.25); }
        .action-btns { display: flex; gap: 8px; }
        .btn-action { background: transparent; border: 1px solid var(--border); color: var(--text-muted); width: 38px; height: 38px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 0.95rem; }
        .btn-action:hover { color: var(--primary); border-color: var(--primary); }
        .btn-action.playing { background: var(--primary); color: white; border-color: var(--primary); }
        .audio-player-bar { position: fixed; bottom: 15px; left: 50%; transform: translateX(-50%); width: calc(100% - 30px); max-width: 600px; background: var(--bg-card); border: 1px solid var(--border); box-shadow: 0 10px 30px rgba(0,0,0,0.15); border-radius: 30px; padding: 10px 20px; display: none; align-items: center; justify-content: space-between; z-index: 1000; }
        .audio-player-bar.active { display: flex; }
    </style>
</head>
<body>
    <header>
        <div class="nav-container">
            <div class="logo">
                <i class="fa-solid fa-kaaba"></i>
                <span>زیکری ڕۆژانە</span>
            </div>
            <div class="controls">
                <button class="btn-icon" id="fontSizeBtn" title="قەبارەی فۆنت"><i class="fa-solid fa-font"></i></button>
                <button class="btn-icon" id="themeBtn" title="دۆخی ڕووناکی/تاریکی"><i class="fa-solid fa-moon"></i></button>
            </div>
        </div>
    </header>

    <div class="container">
        <div class="tabs-container">
            <button class="tab-btn active" id="morningTab">
                <i class="fa-solid fa-sun"></i>
                زیکری بەیانیان
            </button>
            <button class="tab-btn" id="eveningTab">
                <i class="fa-solid fa-moon"></i>
                زیکری ئێواران
            </button>
        </div>

        <div class="progress-card">
            <div class="progress-header">
                <span id="progressTitle">پێشکەوتنی بەیانیان</span>
                <span id="progressPercent">0%</span>
            </div>
            <div class="progress-bar-bg">
                <div class="progress-bar-fill" id="progressBar"></div>
            </div>
        </div>

        <div class="search-box">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" id="searchInput" placeholder="گەڕان لەناو زیکرەکاندا...">
        </div>

        <div class="zikr-list" id="zikrContainer"></div>
    </div>

    <div class="audio-player-bar" id="audioPlayerBar">
        <div style="display: flex; align-items: center; gap: 10px; font-size: 0.9rem; font-weight: 600;">
            <i class="fa-solid fa-volume-high" style="color: var(--primary);"></i>
            <span id="playingZikrTitle">خوێندنەوە...</span>
        </div>
        <div>
            <button class="btn-action" id="stopAudioBtn"><i class="fa-solid fa-stop"></i></button>
        </div>
    </div>

    <script>
        var morningZikrs = [
            { id: 'm1', text: "أَعُوْذُ بِاللّٰهِ مِنَ الشَّيْطَانِ الرَّجِيْمِ. اَللّٰهُ لَآ إِلٰهَ إِلَّا هُوَ الْحَىُّ الْقَيُّوْمُ ، لَا تَأْخُذُهُۥ سِنَةٌ وَّلَا نَوْمٌ ، لَهُ مَا فِى السَّمٰـوٰتِ وَمَا فِى الْأَرْضِ ، مَنْ ذَا الَّذِىْ يَشْفَعُ عِنْدَهُ إِلَّا بِإِذْنِهِۦ ، يَعْلَمُ مَا بَيْنَ أَيْدِيْهِمْ وَمَا خَلْفَهُمْ ، وَلَا يُحِيْطُوْنَ بِشَىْءٍ مِّنْ عِلْمِهِٓ إِلَّا بِمَا شَآءَ ، وَسِعَ كُرْسِيُّهُ السَّمٰـوٰتِ وَالْأَرْضَ، وَلَا يَئُوْدُهُۥ حِفْظُهُمَا ، وَهُوَ الْعَلِىُّ الْعَظِيْمُ.", count: 1 },
            { id: 'm2', text: "بِسْمِ اللّٰهِ الرَّحْمٰنِ الرَّحِيْمِ. قُلْ هُوَ اللّٰهُ أَحَدٌ ، اَللّٰهُ الصَّمَدُ ، لَمْ يَلِدْ وَلَمْ يُوْلَدْ ، وَلَمْ يَكُنْ لَّهُ كُفُوًا أَحَدٌ.\n\nبِسْمِ اللّٰهِ الرَّحْمٰنِ الرَّحِيْمِ. قُلْ أَعُوْذُ بِرَبِّ الْفَلَقِ ، مِنْ شَرِّ مَا خَلَقَ ، وَمِنْ شَرِّ غَاسِقٍ إِذَا وَقَبَ ، وَمِنْ شَرِّ النَّفَّاثَاتِ فِي الْعُقَدِ ، وَمِنْ شَرِّ حَاسِدٍ إِذَا حَسَدَ.\n\nبِسْمِ اللّٰهِ الرَّحْمٰنِ الرَّحِيْمِ. قُلْ أَعُوْذُ بِرَبِّ النَّاسِ ، مَلِكِ النَّاسِ ، إِلٰهِ النَّاسِ ، مِنْ شَرِّ الْوَسْوَاسِ الْخَنَّاسِ ، اَلَّذِيْ يُوَسْوِسُ فِيْ صُدُوْرِ النَّاسِ ، مِنَ الْجِنَّةِ وَالنَّاسِ.", count: 3 },
            { id: 'm3', text: "اَللّٰهُمَّ أَنْتَ رَبِّيْ لَا إِلٰهَ إِلَّا أَنْتَ ، خَلَقْتَنِيْ وَأَنَا عَبْدُكَ ، وَأَنَا عَلَىٰ عَهْدِكَ وَوَعْدِكَ مَا اسْتَطَعْتُ ، أَعُوْذُ بِكَ مِنْ شَرِّ مَا صَنَعْتُ ، أَبُوْءُ لَكَ بِنِعْمَتِكَ عَلَيَّ وَأَبُوْءُ لَكَ بِذَنْبِيْ ، فَاغْفِرْ لِيْ فَإِنَّهُ لَا يَغْفِرُ الذُّنُوْبَ إِلَّا أَنْتَ.", count: 1 },
            { id: 'm4', text: "اَللّٰهُمَّ إِنِّيْ أَعُوْذُ بِكَ مِنَ الْهَمِّ وَالْحَزَنِ ، وَأَعُوْذُ بِكَ مِنَ الْعَجْزِ وَالْكَسَلِ، وَأَعُوْذُ بِكَ مِنَ الْجُبْنِ وَالْبُخْلِ ، وَأَعُوْذُ بِكَ مِنْ غَلَبَةِ الدَّيْنِ وَقَهْرِ الرِّجَالِ.", count: 1 },
            { id: 'm5', text: "اَللّٰهُمَّ إِنِّيْ أَسْأَلُكَ الْعَافِيَةَ فِي الدُّنْيَا وَالْآخِرَةِ ، اَللّٰهُمَّ إِنِّيْ أَسْأَلُكَ الْعَفْوَ وَالْعَافِيَةَ فِيْ دِيْنِيْ وَدُنْيَايَ وَأَهْلِيْ وَمَالِيْ ، اَللّٰهُمَّ اسْتُرْ عَوْرَاتِيْ وَآمِنْ رَوْعَاتِيْ ، اَللّٰهُمَّ احْفَظْنِيْ مِنْ بَيْنِ يَدَيَّ ، وَمِنْ خَلْفِيْ ، وَعَنْ يَّمِيْنِيْ ، وَعَنْ شِمَالِيْ ، وَمِنْ فَوْقِيْ ، وَأَعُوْذُ بِعَظَمَتِكَ أَنْ أُغْتَالَ مِنْ تَحْتِيْ.", count: 1 },
            { id: 'm6', text: "اَللّٰهُمَّ فَاطِرَ السَّمٰوَاتِ وَالْأَرْضِ ، عَالِمَ الْغَيْبِ وَالشَّهَادَةِ ، رَبَّ كُلِّ شَيْءٍ وَّمَلِيْكَهُ ، أَشْهَدُ أَنْ لَّا إِلٰهَ إِلَّا أَنْتَ ، أَعُوْذُ بِكَ مِنْ شَرِّ نَفْسِيْ ، وَمِنْ شَرِّ الشَّيْطَانِ وَشِرْكِهِ ، وَأَنْ أَقْتَرِفَ عَلَىٰ نَفْسِيْ سُوْءًا أَوْ أَجُرَّهُ إِلَىٰ مُسْلِمٍ.", count: 1 },
            { id: 'm7', text: "يَا حَيُّ يَا قَيُّوْمُ ، بِرَحْمَتِكَ أَسْتَغِيْثُ ، أَصْلِحْ لِيْ شَأْنِيْ كُلَّهُ ، وَلَا تَكِلْنِيْ إِلَىٰ نَفْسِيْ طَرْفَةَ عَيْنٍ.", count: 1 },
            { id: 'm8', text: "اَللّٰهُمَّ مَا أَصْبَحَ بِيْ مِنْ نِّعْمَةٍ أَوْ بِأَحَدٍ مِّنْ خَلْقِكَ ، فَمِنْكَ وَحْدَكَ لَا شَرِيْكَ لَكَ ، فَلَكَ الْحَمْدُ وَلَكَ الشُّكْرُ.", count: 1 },
            { id: 'm9', text: "أَصْبَحْنَا عَلَىٰ فِطْرَةِ الْإِسْلَامِ ، وَعَلَىٰ كَلِمَةِ الْإِخْلَاصِ ، وَعَلَىٰ دِيْنِ نَبِيِّنَا مُحَمَّدٍ ، وَعَلَىٰ مِلَّةِ أَبِيْنَا إِبْرَاهِيْمَ حَنِيْفًا مُّسْلِمًا وَّمَا كَانَ مِنَ الْمُشْرِكِيْنَ.", count: 1 },
            { id: 'm10', text: "أَصْبَحْتُ أُثْنِيْ عَلَيْكَ حَمْدًا ، وَأَشْهَدُ أَنْ لَّا إِلٰهَ إِلَّا اللّٰهُ.", count: 3 },
            { id: 'm11', text: "أَصْبَحْنَا وَأَصْبَحَ الْمُلْكُ لِلّٰهِ وَالْحَمْدُ لِلّٰهِ ، لَا إِلٰهَ إِلَّا اللّٰهُ وَحْدَهُ لَا شَرِيْكَ لَهُ ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ ، وَهُوَ عَلَىٰ كُلِّ شَيْءٍ قَدِيْرٌ ، رَبِّ أَسْأَلُكَ خَيْرَ مَا فِيْ هٰذَا الْيَوْمِ وَخَيْرَ مَا بَعْدَهُ ، وَأَعُوْذُ بِكَ مِنْ شَرِّ مَا فِيْ هٰذَا الْيَوْمِ وَشَرِّ مَا بَعْدَهُ ، رَبِّ أَعُوْذُ بِكَ مِنَ الْكَسَلِ وَسُوْءِ الْكِبَرِ ، رَبِّ أَعُوْذُ بِكَ مِنْ عَذَابٍ فِي النَّارِ وَعَذَابٍ فِي الْقَبْرِ.", count: 1 },
            { id: 'm12', text: "أَصْبَحْنَا وَأَصْبَحَ الْمُلْكُ لِلّٰهِ رَبِّ الْعَالَمِيْنَ ، اَللّٰهُمَّ إِنِّيْ أَسْأَلُكَ خَيْرَ هٰذَا الْيَوْمِ ، فَتْحَهُ وَنَصْرَهُ وَنُوْرَهُ وَبَرَكَتَهُ وَهُدَاهُ ، وَأَعُوْذُ بِكَ مِنْ شَرِّ مَا فِيْهِ وَشَرِّ مَا بَعْدَهُ.", count: 1 },
            { id: 'm13', text: "اَللّٰهُمَّ إِنِّيْ أَصْبَحْتُ أُشْهِدُكَ ، وَأُشْهِدُ حَمَلَةَ عَرْشِكَ وَمَلَائِكَتَكَ وَجَمِيْعَ خَلْقِكَ ، أَنَّكَ أَنْتَ اللّٰهُ لَا إِلٰهَ إِلَّا أَنْتَ وَحْدَكَ لَا شَرِيْكَ لَكَ ، وَأَنَّ مُحَمَّدًا عَبْدُكَ وَرَسُوْلُكَ.", count: 4 },
            { id: 'm14', text: "اَللّٰهُمَّ بِكَ أَصْبَحْنَا وَبِكَ أَمْسَيْنَا وَبِكَ نَحْيَا وَبِكَ نَمُوْتُ وَإِلَيْكَ النُّشُوْرُ.", count: 1 },
            { id: 'm15', text: "اَللّٰهُمَّ عَافِنِيْ فِيْ بَدَنِيْ ، اَللّٰهُمَّ عَافِنِيْ فِيْ سَمْعِيْ ، اَللّٰهُمَّ عَافِنِيْ فِيْ بَصَرِيْ ، لَا إِلٰهَ إِلَّا أَنْتَ ، اَللّٰهُمَّ إِنِّيْ أَعُوْذُ بِكَ مِنَ الْكُفْرِ وَالْفَقْرِ، وأَعُوْذُ بِكَ مِنْ عَذَابِ الْقَبْرِ، لَا إِلٰهَ إِلَّا أَنْتَ.", count: 3 },
            { id: 'm16', text: "حَسْبِيَ اللّٰهُ لَا إِلٰهَ إِلَّا هُوَ ، عَلَيْهِ تَوَكَّلتُ ، وَهُوَ رَبُّ الْعَرْشِ الْعَظِيْمِ.", count: 7 },
            { id: 'm17', text: "رَضِيْتُ بِاللّٰهِ رَبًّا ، وَبِالْإِسْلَامِ دِيْنًا ، وَبِمُحَمَّدٍ نَّبِيًّا.", count: 3 },

        var currentCategory = 'morning';
        var zikrCounts = {};
        var activeAudioId = null;

        function initCounts() {
            morningZikrs.forEach(function(z) { zikrCounts[z.id] = z.count; });
            eveningZikrs.forEach(function(z) { zikrCounts[z.id] = z.count; });
        }

        function switchCategory(cat) {
            currentCategory = cat;
            document.getElementById('morningTab').classList.toggle('active', cat === 'morning');
            document.getElementById('eveningTab').classList.toggle('active', cat === 'evening');
            document.getElementById('progressTitle').innerText = cat === 'morning' ? 'پێشکەوتنی بەیانیان' : 'پێشکەوتنی ئێواران';
            stopAudio();
            renderZikrs();
            updateProgressBar();
        }

        function renderZikrs() {
            var container = document.getElementById('zikrContainer');
            var data = currentCategory === 'morning' ? morningZikrs : eveningZikrs;
            var searchVal = document.getElementById('searchInput').value.toLowerCase();

            container.innerHTML = '';

            data.forEach(function(zikr) {
                if (searchVal && zikr.text.toLowerCase().indexOf(searchVal) === -1) return;

                var currentVal = zikrCounts[zikr.id];
                var isCompleted = currentVal === 0;

                var card = document.createElement('div');
                card.className = 'zikr-card' + (isCompleted ? ' completed' : '');

                var textDiv = document.createElement('div');
                textDiv.className = 'zikr-text';
                textDiv.textContent = zikr.text;

                var footerDiv = document.createElement('div');
                footerDiv.className = 'zikr-footer';

                var counterBtn = document.createElement('button');
                counterBtn.className = 'counter-btn';
                counterBtn.disabled = isCompleted;
                counterBtn.innerHTML = '<i class="fa-solid fa-hand-pointer"></i> <span>' + (currentVal === 0 ? 'تەواوبوو' : currentVal + ' جار') + '</span>';
                counterBtn.onclick = function() { decrementCount(zikr.id); };

                var actionsDiv = document.createElement('div');
                actionsDiv.className = 'action-btns';

                var playBtn = document.createElement('button');
                playBtn.className = 'btn-action' + (activeAudioId === zikr.id ? ' playing' : '');
                playBtn.title = 'خوێندنەوە';
                playBtn.innerHTML = '<i class="fa-solid ' + (activeAudioId === zikr.id ? 'fa-pause' : 'fa-volume-high') + '"></i>';
                playBtn.onclick = function() { toggleAudio(zikr.id); };

                var resetBtn = document.createElement('button');
                resetBtn.className = 'btn-action';
                resetBtn.title = 'ڕێستکردنەوە';
                resetBtn.innerHTML = '<i class="fa-solid fa-rotate-right"></i>';
                resetBtn.onclick = function() { resetZikr(zikr.id, zikr.count); };

                actionsDiv.appendChild(playBtn);
                actionsDiv.appendChild(resetBtn);

                footerDiv.appendChild(counterBtn);
                footerDiv.appendChild(actionsDiv);

                card.appendChild(textDiv);
                card.appendChild(footerDiv);
                container.appendChild(card);
            });
        }

        function decrementCount(id) {
            if (zikrCounts[id] > 0) {
                zikrCounts[id]--;
                if (navigator.vibrate) navigator.vibrate(30);
                renderZikrs();
                updateProgressBar();
            }
        }

        function resetZikr(id, defaultCount) {
            zikrCounts[id] = defaultCount;
            renderZikrs();
            updateProgressBar();
        }

        function updateProgressBar() {
            var data = currentCategory === 'morning' ? morningZikrs : eveningZikrs;
            var totalNeeded = 0;
            var totalDone = 0;

            data.forEach(function(z) {
                totalNeeded += z.count;
                totalDone += (z.count - zikrCounts[z.id]);
            });

            var percent = totalNeeded > 0 ? Math.round((totalDone / totalNeeded) * 100) : 0;
            document.getElementById('progressBar').style.width = percent + '%';
            document.getElementById('progressPercent').innerText = percent + '%';
        }

        function toggleAudio(id) {
            if (!('speechSynthesis' in window)) {
                alert('ببورە، وێبگەڕەکەت پشتگیری لە خوێندنەوەی دەنگی ناکات.');
                return;
            }

            if (activeAudioId === id) {
                stopAudio();
                return;
            }

            stopAudio();

            var data = morningZikrs.concat(eveningZikrs);
            var item = null;
            for(var i=0; i<data.length; i++) {
                if(data[i].id === id) { item = data[i]; break; }
            }
            if (!item) return;

            activeAudioId = id;
            document.getElementById('audioPlayerBar').classList.add('active');
            document.getElementById('playingZikrTitle').innerText = item.text.substring(0, 30) + "...";

            var utterance = new SpeechSynthesisUtterance(item.text);
            utterance.lang = 'ar-SA';
            utterance.rate = 0.85;

            utterance.onend = function() { stopAudio(); };
            utterance.onerror = function() { stopAudio(); };

            window.speechSynthesis.speak(utterance);
            renderZikrs();
        }

        function stopAudio() {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
            }
            activeAudioId = null;
            document.getElementById('audioPlayerBar').classList.remove('active');
            renderZikrs();
        }

        document.getElementById('morningTab').addEventListener('click', function() { switchCategory('morning'); });
        document.getElementById('eveningTab').addEventListener('click', function() { switchCategory('evening'); });
        document.getElementById('searchInput').addEventListener('input', renderZikrs);
        document.getElementById('stopAudioBtn').addEventListener('click', stopAudio);

        document.getElementById('themeBtn').addEventListener('click', function() {
            var currentTheme = document.documentElement.getAttribute('data-theme');
            var newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', newTheme);
            document.getElementById('themeBtn').innerHTML = newTheme === 'dark' ? '<i class="fa-solid fa-sun"></i>' : '<i class="fa-solid fa-moon"></i>';
        });

        var currentFontState = 1;
        var fontSizes = ['1.1rem', '1.35rem', '1.6rem'];
        document.getElementById('fontSizeBtn').addEventListener('click', function() {
            currentFontState = (currentFontState + 1) % 3;
            document.documentElement.style.setProperty('--base-font-size', fontSizes[currentFontState]);
        });

        initCounts();
        renderZikrs();
        updateProgressBar();
    </script>
</body>
</html>
